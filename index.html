<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="description" content="Magadh University और बिहार के विश्वविद्यालय, कॉलेज, परीक्षा updates, MCQ और study material एक जगह।"><meta property="og:title" content="AKM Student Portal"><meta property="og:description" content="Magadh University और बिहार के विश्वविद्यालय, कॉलेज, परीक्षा updates, MCQ और study material एक जगह।"><meta property="og:type" content="website"><!--OG--><!--/OG--><title>AKM Student Portal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600&display=swap">
<style>
:root{--bg:#f5f5f5;--card:#fff;--tx:#0a0a0a;--mu:#6b6b70;--pr:#0a0a0a;--on:#fff;--bd:#e4e4e7;--ok:#1a7f37;--er:#c62828;--sh:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#000;--card:#101011;--tx:#f5f5f7;--mu:#98989f;--pr:#fff;--on:#000;--bd:#252528;--ok:#30d158;--er:#ff6961;--sh:none}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#000;--card:#101011;--tx:#f5f5f7;--mu:#98989f;--pr:#fff;--on:#000;--bd:#252528;--ok:#30d158;--er:#ff6961;--sh:none}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font:15px/1.6 Poppins,"Noto Sans Devanagari",system-ui,-apple-system,sans-serif;padding-bottom:104px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#000;z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:#000;color:#fff;display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid #1f1f22}
.logo{width:42px;height:42px;border-radius:12px;background:#fff;color:#000;font-weight:700;display:grid;place-items:center;font-size:14px;letter-spacing:-.5px}
header h1{font-size:12.5px;line-height:1.4;flex:1;font-weight:400;letter-spacing:.28em;text-transform:uppercase}header small{display:block;font-weight:400;color:#8e8e93;font-size:9.5px;letter-spacing:.24em;text-transform:uppercase}
.mono{height:28px;width:auto;display:block;flex:none}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}.hl{display:block;width:150px;max-width:55%;height:auto;margin:0 0 16px;position:relative}
.ib{background:#16161a;border:1px solid #2a2a2e;color:#fff;border-radius:12px;height:38px;min-width:38px;font-size:16px;filter:grayscale(1)}
main{max-width:720px;margin:auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.hero{position:relative;overflow:hidden;background:linear-gradient(145deg,#000,#1c1c1f);color:#fff;border:1px solid #2a2a2e;padding:22px}
.hero::after{content:"";position:absolute;right:-50px;top:-50px;width:190px;height:190px;border-radius:50%;background:radial-gradient(rgba(255,255,255,.2),transparent 70%)}
.hero h2{font-size:22px;position:relative;font-weight:600}.hero p{color:#c7c7cc;margin-top:6px;position:relative;font-size:14px}
.hero .btn{background:#fff;color:#000}
.pill{display:inline-block;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:99px;padding:3px 12px;font-size:12px;margin:10px 6px 0 0;position:relative;filter:grayscale(1)}
h3{font-size:15px;margin:20px 2px 10px;font-weight:600;letter-spacing:.3px}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:4px}
.st div{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px 6px;text-align:center;box-shadow:var(--sh)}
.st b{display:block;font-size:24px;font-weight:700;color:var(--tx)}.st span{font-size:11px;color:var(--mu);letter-spacing:.6px;text-transform:uppercase}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;text-decoration:none;color:var(--tx);font-weight:600;font-size:13px;box-shadow:var(--sh)}
.ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none;filter:grayscale(1)}
.g0,.g1,.g2,.g3{background:var(--bd)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:10px 0;padding-bottom:2px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:7px 15px;white-space:nowrap;font:inherit;font-size:13px}
.chip.on{background:var(--pr);color:var(--on);border-color:var(--pr)}
input,select,textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;margin:4px 0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--tx)}
.btn{background:var(--pr);color:var(--on);border:0;border-radius:12px;padding:13px 16px;font:inherit;font-weight:600;letter-spacing:.2px;width:100%;margin-top:8px}
.btn.s{background:transparent;color:var(--tx);border:1px solid var(--tx)}.btn.d{background:none;color:var(--er);border:1px solid var(--er);width:auto;padding:4px 10px;font-size:12px;margin:0}
.mu{color:var(--mu);font-size:13px}
.tag{font-size:11px;font-weight:600;background:transparent;border:1px solid var(--bd);color:var(--tx);border-radius:7px;padding:1px 8px;margin-right:4px;text-decoration:none;display:inline-block}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.av{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:700;background:var(--pr);color:var(--on);flex:none;font-size:14px}.av.a{background:transparent;color:var(--tx);border:1.5px solid var(--tx)}
.nd{width:48px;text-align:center;border-radius:12px;background:var(--pr);color:var(--on);padding:5px 0;flex:none}.nd b{display:block;font-size:18px;line-height:1.1}.nd span{font-size:10px;opacity:.8}
.opt{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--card);color:var(--tx);border:1.5px solid var(--bd);border-radius:12px;padding:12px;margin:9px 0;font:inherit}
.opt i{font-style:normal;width:26px;height:26px;border-radius:8px;background:var(--bd);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.opt.ok{border-color:var(--ok);background:rgba(26,127,55,.12)}.opt.no{border-color:var(--er);background:rgba(198,40,40,.12)}
.bar{height:6px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pr);border-radius:9px}
details summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:600}
details summary::-webkit-details-marker{display:none}details p{margin-top:8px}
.find{position:sticky;top:calc(64px + env(safe-area-inset-top,0px));z-index:5;background:var(--bg);padding-bottom:2px}
.lk{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.lk a{font-size:11px;font-weight:600;background:transparent;border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:2px 8px;text-decoration:none}
.foot{text-align:center;padding:14px 0 6px;font-size:13px}.foot a{color:var(--tx);font-weight:600;cursor:pointer;text-decoration:underline}.ad{margin:12px 0;text-align:center}.ad small{display:block;font-size:10px;color:var(--mu);margin-bottom:2px}.lg p{margin:8px 0;font-size:14px}.lg h3{margin-top:0}
.jn{display:flex;align-items:center;gap:12px;background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;text-decoration:none;color:var(--tx);margin-top:10px}.jn svg{flex:none}.jn span{flex:1;min-width:0}.jn b{display:block;font-size:14px;line-height:1.25}.jn small{color:var(--mu);font-size:12px}.jn i{font-style:normal;color:var(--mu);font-size:20px}.fs{display:flex;justify-content:center;gap:14px;margin-top:18px}.fs a{display:block;line-height:0}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:9;background:#0a0a0a;border:1px solid #2a2a2e;border-radius:20px;display:flex;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.35);max-width:696px;margin:auto}
nav button{flex:1;border:0;background:none;color:#8e8e93;font:inherit;font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0;border-radius:14px}
nav button b{font-size:20px;font-weight:400;line-height:1.2;filter:grayscale(1)}nav button.on{background:#fff;color:#000;font-weight:600}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal>div{background:var(--card);width:100%;max-width:720px;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#000;color:#fff;border:1px solid #333;padding:8px 16px;border-radius:99px;font-size:13px;z-index:30;opacity:0;transition:.25s;pointer-events:none}#toast.on{opacity:1}
</style>
</head>
